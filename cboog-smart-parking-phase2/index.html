<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <div class="workspace-label">WORKSPACE</div>
      <nav id="primary-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="customer-overview"><span class="nav-icon">◫</span><span>Customer app</span><span class="nav-tag">APP</span></button>
        <div class="nav-divider"></div><div class="workspace-label">MANAGEMENT</div>
        <button class="nav-item" data-view="dashboard"><span class="nav-icon">▦</span><span>Dashboard</span></button>
        <button class="nav-item" data-view="live-parking"><span class="nav-icon">▤</span><span>Live parking</span><span class="live-dot"></span></button>
        <button class="nav-item" data-view="ai-monitoring"><span class="nav-icon">◎</span><span>AI monitoring</span></button>
        <button class="nav-item" data-view="zones"><span class="nav-icon">⌗</span><span>Parking zones</span></button>

        <button class="nav-item" data-view="users"><span class="nav-icon">♙</span><span>Users</span></button>
        <button class="nav-item" data-view="reports"><span class="nav-icon">▥</span><span>Reports</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="mall-chip"><span class="status-pulse"></span><div><b>Demo environment</b><small>Local preview · sample data</small></div></div><div class="admin-mini"><div class="avatar">CB</div><div><b>Admin User</b><small>Administrator</small></div><button class="icon-btn" aria-label="Account options" id="account-menu">···</button></div></div>

    <main class="main-area">

      <section id="view-root" class="view-root" tabindex="-1"></section>
      <footer class="app-footer"><span>© 2026 CBOOG · M-SMART FLOW & ECO-REWARDS</span><span>FRONTEND PREVIEW <b>·</b> SAMPLE DATA</span></footer>
